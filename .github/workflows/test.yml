name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pems_test_import
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pems_test_import"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt 'psycopg[binary]'
      - name: Prepare test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d pems_test_import -f sql/schema.sql
          psql -h 127.0.0.1 -U postgres -d pems_test_import -f sql/005_authentication.sql
          psql -h 127.0.0.1 -U postgres -d pems_test_import -f sql/003_reference_data.sql
          psql -h 127.0.0.1 -U postgres -d pems_test_import -f sql/004_dashboard_views.sql
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Lint
        run: ruff check app scripts tests --select E9,F
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pems_test_import
        run: python -m pytest -q
